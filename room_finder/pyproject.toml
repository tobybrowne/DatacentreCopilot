[project]
name = "room-finder-core"
version = "0.1.0"
description = "DINOv2-based room classification — training, evaluation, and inference."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "opencv-python>=4.13.0.92",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[tool.setuptools.packages.find]
include = ["room_finder_core*"]
